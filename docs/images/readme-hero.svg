<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">ResearchBoost — Build your research expertise, faster.</title>
  <desc id="desc">A research skill that turns keywords, papers, researchers, or research groups into a problem-led field map, an editable presentation, and next experiments.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091525"/><stop offset="1" stop-color="#123C43"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#32DCC1" stop-opacity=".12"/><stop offset="1" stop-color="#32DCC1" stop-opacity="0"/></radialGradient>
  </defs>
