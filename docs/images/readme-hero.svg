    <text x="48" y="139" font-size="64" font-weight="700" letter-spacing="-2" fill="#F5FAFF">ResearchBoost</text>
    <text x="48" y="192" font-size="29" font-weight="600" fill="#CFF38D">Build your research expertise, faster.</text>
    <text x="48" y="235" font-size="18" fill="#B7CBD7">Start with a keyword. Explore a field. Find your next question.</text>
